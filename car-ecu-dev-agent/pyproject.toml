[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-ecu-dev-agent"
version = "0.1.0"
description = "V-Model SDLC agent pipeline for automotive ECU driver development"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
yaml = ["pyyaml>=6.0"]

[tool.setuptools]
# vda_agent 物理位于 engine/ 下，通过 package-dir 映射为顶层可导入包
package-dir = {vda_agent = "engine/vda_agent"}
# 根目录下的演示脚本作为顶层模块安装，使 `run-pipeline` / `gui-server` 与 `python -m` 可用
py-modules = ["run_poc_pipeline", "run_matrix", "run_codegen_gate"]

[tool.setuptools.packages.find]
# 同时扫描项目根与 engine/，才能发现物理位于 engine/vda_agent 的包
where = [".", "engine"]
include = ["adapter*", "domains*", "gui*", "vda_agent*"]

[project.scripts]
run-pipeline = "run_poc_pipeline:main"
gui-server = "gui.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 开发态无需 pip install -e . 也能跑测试：显式把项目根与 engine/ 加入路径
pythonpath = [".", "engine"]

[tool.coverage.run]
# 仅统计核心层（六层引擎），供 Phase 4 CI 覆盖率门禁使用
source = ["engine.vda_agent.core"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
