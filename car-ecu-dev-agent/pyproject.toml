[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-ecu-dev-agent"
version = "0.1.0"
description = "V-Model SDLC agent pipeline for automotive ECU driver development"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
yaml = ["pyyaml>=6.0"]

[tool.setuptools]
# vda_agent 物理位于 engine/ 下，通过 package-dir 映射为顶层可导入包
packages = ["adapter", "adapter.*", "domains", "domains.*", "gui", "gui.*", "vda_agent", "vda_agent.*"]

[tool.setuptools.package-dir]
vda_agent = "engine/vda_agent"

[project.scripts]
run-pipeline = "run_poc_pipeline:main"
gui-server = "gui.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
